<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario-Mateo,Ghanem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fondo">
        <h1>Formulario de Registro</h1>

        <form action="#" method="POST" id="registroForm">
            <fieldset class="caja">
                <legend>Datos Personales</legend>
<div>
                <div id="container">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div id="container">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni" placeholder="Ej: 12345678" required>
                </div>
</div>
<div>
                <div id="container">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div id="container">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: juan@correo.com" required>
                </div>
</div>
<div>
                <div id="container">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div id="container">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678" required>
                </div>
</div>
            </fieldset>

            <fieldset class="caja">
                <legend>Información Adicional</legend>

<div>
                <div id="container">
                <label for="curso">Elige a que curso desea inscribirse:</label>
                <select id="curso" name="curso" required>
                    <option value="curso1">HTML</option>
                    <option value="curso2">CSS</option>
                    <option value="curso3">JavaScript</option>
                    <option value="curso4">PHP</option>
                </select>
                </div>


                <div id="container">
                    <label>Turno preferido:</label>
                        <label>
                            <input type="radio" name="turno" value="manana">
                            Mañana
                        </label>
                        <label>
                            <input type="radio" name="turno" value="tarde">
                            Tarde
                        </label>
                        <label>
                            <input type="radio" name="turno" value="noche">
                            Noche
                        </label>
                </div>

                <div id="container">
                    <label>Conocimientos previos:</label>
                        <label>
                            <input type="checkbox" name="previos" value="html">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="css">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="java">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="nin">
                            Ninguno
                        </label>
                </div>
</div>
<div>
                <div id="containertxt">
                    <label for="porque">Por qué desea realizar el curso:</label>
                    <textarea id="porque" name="porque" rows="6" placeholder="Escribe aquí..."></textarea>
                </div>
</div>
            </fieldset>

            <div style="margin: 20px;">
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>

            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>
</body>
</html>
