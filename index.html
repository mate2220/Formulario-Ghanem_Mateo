<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario-Mateo,Ghanem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div>
        <h1>Formulario de Registro</h1>
        <p>Completa todos los campos para crear tu cuenta</p>

        <form action="#" method="POST" id="registroForm">
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div>
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni" placeholder="EJj: 12345678">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="Ej: juan@correo.com" required>
                </div>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>

            </fieldset>

            <fieldset>
                <legend>Información Adicional</legend>

                <label for="curso">Elige que curso inscribirse:</label>
                <select id="curso" name="curso">
                    <option value="curso1">HTML</option>
                    <option value="curso2">CSS</option>
                    <option value="curso3">JavaScript</option>
                    <option value="curso4">PHP</option>
                </select>

                <div>
                    <label>Turno preferido:</label>
                    <div>
                        <label>
                            <input type="radio" name="turno" value="manana">
                            Mañana
                        </label>
                        <label>
                            <input type="radio" name="turno" value="tarde">
                            Tarde
                        </label>
                        <label>
                            <input type="radio" name="turno" value="noche">
                            Noche
                        </label>
                    </div>
                </div>

                <div>
                    <label>Conocimientos previos:</label>
                    <div>
                        <label>
                            <input type="checkbox" name="previos" value="html">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="css">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="java">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="previos" value="nin">
                            Ninguno
                        </label>
                    </div>
                </div>

                <div>
                    <label for="porquq">Por qué desea realizar el curso</label>
                    <textarea id="porque" name="porque" rows="4" placeholder="Escribe aquí..."></textarea>
                </div>
            </fieldset>

            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>
</body>
</html>
